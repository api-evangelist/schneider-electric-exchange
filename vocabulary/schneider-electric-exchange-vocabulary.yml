aid: schneider-electric-exchange
name: Schneider Electric Exchange
description: >-
  Vocabulary and taxonomy for Schneider Electric Exchange developer platform
  covering EcoStruxure APIs and Partner Commerce APIs.
version: '1.0'
created: '2026-05-02'
modified: '2026-05-02'
tags:
  - Building Automation
  - EcoStruxure
  - Energy Management
  - Industrial IoT
  - Schneider Electric

terms:
  - term: EcoStruxure
    definition: >-
      Schneider Electric's IoT-enabled, open architecture platform for energy
      management and automation. EcoStruxure spans IT (data centers), Facility
      (buildings), Grid (utilities), Industry (manufacturing), and Plant levels.
    category: Platform

  - term: EcoStruxure IT Expert
    definition: >-
      A cloud-based data center infrastructure management (DCIM) solution that
      monitors UPS, PDU, cooling, and other IT physical infrastructure. The
      IT Expert API provides access to device, sensor, alarm, and measurement data.
    category: Product

  - term: EcoStruxure Facility Expert
    definition: >-
      A cloud-based building management solution for monitoring and managing
      building systems including HVAC, electrical distribution, and fire safety.
      Provides time series and alarm data via API.
    category: Product

  - term: Exchange Developer Portal
    definition: >-
      The Schneider Electric developer hub at exchange.se.com/develop providing
      EcoStruxure API documentation, authentication guides, and API product catalog.
    category: Platform

  - term: Partner APIs
    definition: >-
      B2B REST APIs available at api-explorer.se.com for Schneider Electric
      distributors, resellers, and integration partners. Covers product catalog,
      pricing, availability, orders, quotes, and digital assets.
    category: Platform

  - term: Commercial Reference
    definition: >-
      Schneider Electric's standard product identifier (SKU). Used across
      all Partner APIs to identify products for pricing, availability, and
      catalog queries.
    category: Commerce

  - term: ETIM
    definition: >-
      Electrotechnical Information Model — an industry-standard classification
      system for electrical products. Schneider Electric uses ETIM 10.0 in
      the Product Catalog API for structured technical attributes.
    category: Standard
    version: "10.0"

  - term: Net Price
    definition: >-
      The partner-specific negotiated price for a product, after applying
      account-specific discounts from the public list price. Returned by the
      Net Price API based on the authenticated partner account.
    category: Commerce

  - term: Time Series
    definition: >-
      Chronological sequences of sensor measurements from EcoStruxure devices.
      Time series data includes energy consumption, temperature, voltage,
      current, and other physical measurements at regular intervals.
    category: Data Type

  - term: Device
    definition: >-
      A physical piece of infrastructure monitored by EcoStruxure IT Expert,
      such as a UPS (Uninterruptible Power Supply), PDU (Power Distribution
      Unit), CRAC (Computer Room Air Conditioning), or network switch.
    category: Resource

  - term: Alarm
    definition: >-
      A notification generated by an EcoStruxure device or threshold
      configuration indicating a status change or anomaly. Alarms have
      a severity (critical, warning, info) and lifecycle (active, resolved).
    category: Resource

  - term: Sensor
    definition: >-
      A monitoring point on a device that records physical measurements
      (temperature, humidity, power load, etc.). Sensors have a label,
      unit, and belong to a parent device.
    category: Resource

  - term: Location
    definition: >-
      A physical place (data center, building, room, rack) used to organize
      devices in EcoStruxure IT Expert. Locations form a hierarchy and
      are referenced by devices and alarms.
    category: Resource

  - term: Installed Product
    definition: >-
      A Schneider Electric product that has been installed at a customer
      site, identified by serial number. The Installed Product API provides
      warranty start and end dates for field support and asset lifecycle management.
    category: Commerce

  - term: EcoStruxure Exchange
    definition: >-
      The Schneider Electric developer ecosystem and marketplace at
      exchange.se.com where partners can discover, subscribe to, and build
      with EcoStruxure APIs and partner APIs.
    category: Platform

categories:
  - Platform
  - Product
  - Commerce
  - Data Type
  - Resource
  - Standard
