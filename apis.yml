aid: schneider-electric-exchange
name: Schneider Electric Exchange
description: >-
  Schneider Electric Exchange is a developer platform providing APIs for
  EcoStruxure energy management, building automation, industrial IoT, and
  commerce partner integrations. The Exchange platform enables partners and
  developers to build integrations with Schneider Electric products and services.
