apis:
  - aid: schneider-electric-exchange:ecostruxure-it-expert-api
    name: EcoStruxure IT Expert API
    description: >-
      The EcoStruxure IT Expert API gives users a way to integrate EcoStruxure IT
      into their own environments, with functionalities that allow users to
      maintain a local data store or build applications that react to changes in
      their critical infrastructure.
    humanURL: https://devportal.exchange.se.com/
    tags:
      - Data Center
      - EcoStruxure IT
      - Infrastructure Monitoring
    properties:
      - type: Documentation
        url: https://devportal.exchange.se.com/
